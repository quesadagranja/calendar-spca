[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-spca"
version = "1.0.0"
description = "Interpretable sparse principal component analysis for multi-periodic calendar data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Carlos Quesada-Granja"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
examples = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/quesadagranja/calendar-spca"

[tool.setuptools.packages.find]
include = ["calendar_spca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
